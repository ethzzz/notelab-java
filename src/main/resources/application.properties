server.port=8001
server.address=127.0.0.1
# 课程内容涨到 1.26M 字符后，/api/learning/public 不走压缩要传 2MB；gzip 后约 300KB。
# mime-types 刻意不含 text/event-stream（SSE 不能缓冲），其余按 Spring 默认白名单。
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,text/javascript,application/javascript,text/xml,application/xml
server.compression.min-response-size=1KB
spring.application.name=notelab-java
# 笔记导出回显接口（/api/notes/export）用表单提交草稿内容，放宽表单 POST 上限到 10MB
server.tomcat.max-http-form-post-size=10MB
# 练习实践：编辑器插图上传（multipart）。Spring 默认单文件上限仅 1MB，贴张截图就被拒。
# 前端已先做 canvas 压缩（长边 ≤1600），4MB 是给未压缩的大图留的余量。
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=6MB
# 关闭静态资源映射，让未匹配路径走 NoHandlerFoundException（返回与 FastAPI 一致的 {"detail":"Not Found"}）
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
logging.level.org.springframework=WARN
logging.level.com.notelab=INFO
