server.port=8001
server.address=127.0.0.1
spring.application.name=notelab-java
# 关闭静态资源映射，让未匹配路径走 NoHandlerFoundException（返回与 FastAPI 一致的 {"detail":"Not Found"}）
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
logging.level.org.springframework=WARN
logging.level.com.notelab=INFO
