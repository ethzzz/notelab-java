# 2026-10-21：课程内容涨到 1.26M 字符后，/api/learning/public 不压缩要传约 2MB。
# 全局只补 gzip 类型；SSE 的 text/event-stream 刻意不在列表里（流式响应不能缓冲压缩）。
# 注意：nginx.conf 的 http 块已有 `gzip on;`，这里不能再写，否则 duplicate。
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/javascript application/xml text/xml text/plain;
