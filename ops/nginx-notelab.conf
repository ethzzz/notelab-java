# NoteLab B/C 拆分 阶段0：统一入口
# /api/*  -> 127.0.0.1:8001 (notelab-java, SSE 透传)
# /admin  -> 127.0.0.1:3020 (notelab-b, Next basePath=/admin)
# /       -> 127.0.0.1:3010 (notelab-c)
server {
    listen 80 default_server;
    server_name _;

    # RAG 上传走 /api，放宽请求体限制
    client_max_body_size 50m;

    # API：直达 Java 后端，保留原始路径（proxy_pass 不带 URI）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        # SSE 必配
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 精确 /api（无子路径）同样转发，避免落入 C 端
    location = /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # B 端管理台：^~ 保证 /admin 及 /admin/* 全部命中（含 basePath 静态资源 /admin/_next/*）
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C 端（默认）
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
