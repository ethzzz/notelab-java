# NoteLab 统一入口（C 端接管根路径）
#
# 域名：haolo.cloud（已备案）。对外一律用域名访问；IP 直访 301 跳到域名，避免同一站点两个入口。
# 证书：Let's Encrypt（certbot 签发，/etc/letsencrypt/live/haolo.cloud/，系统定时任务自动续期）。
#
# /api/* /api -> 127.0.0.1:8001 (notelab-java, SSE 透传)
# /admin  -> 127.0.0.1:3020 (notelab-b, Next basePath=/admin)
# /ailab  -> 127.0.0.1:8002 (ai-lab, FastAPI 聊天服务, SSE 透传, SSO 门禁)
# /vs     -> 308 /play/vs；游戏本体静态文件反代 :3011（代码在 notelab-c/apps/play/public/vs/）
# /thunder -> 308 /play/thunder；游戏本体静态文件反代 :3011（同上，public/thunder/）
# /blog   -> /var/www/blog (Astro 静态博客)
# /       -> 127.0.0.1:3010 (notelab-c：个人主页 / + 游戏中心 /games)

# ---------------------------------------------------------------- 1) IP 直访：统一跳域名
# 结构化访问日志（2026-10-21）：rid 由 nginx 生成并透传给后端， ops/logs.sh 靠它串链路
log_format notelab_json escape=json '{"ts":"$time_iso8601","rid":"$request_id","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ut":"$upstream_response_time","ua":"$http_user_agent","host":"$host"}';

server {
    listen 80 default_server;
    server_name _;
    return 301 https://haolo.cloud$request_uri;
}

# HTTPS 下用 IP 直访（证书名不匹配，浏览器会先告警再跳转）：同样收敛到域名
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/haolo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haolo.cloud/privkey.pem;

    return 301 https://haolo.cloud$request_uri;
}

# ---------------------------------------------------------------- 2) 域名 HTTP：跳 HTTPS
# 只保留 ACME 续期用的 well-known（certbot 走 webroot，不改动本文件）
server {
    listen 80;
    server_name haolo.cloud www.haolo.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://haolo.cloud$request_uri;
    }
}

# ---------------------------------------------------------------- 3) 主站（HTTPS）
server {
    listen 443 ssl http2;
    server_name haolo.cloud www.haolo.cloud;

    # 双写：combined 保留兼容，JSON 行给 ops/logs.sh 精确解析
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/notelab.json.log notelab_json;
    # 任何页面（不只 /api）都回显 rid，前端报错弹窗可直接展示
    add_header X-Request-Id $request_id always;

    ssl_certificate /etc/letsencrypt/live/haolo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haolo.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 全站 HTTPS 后再开 HSTS（一旦下发，一年内浏览器只会走 HTTPS，回退需先摘掉）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 安全响应头（"零风险"档：不改页面行为，只收紧浏览器默认策略）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 只放 frame-ancestors（= X-Frame-Options 的现代等价物）。
    # 刻意**不**限 script-src/style-src：Next.js 有内联脚本与运行时注入，收紧会白屏。
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # RAG 上传走 /api，放宽请求体限制
    client_max_body_size 50m;

    # API：直达 Java 后端，保留原始路径（proxy_pass 不带 URI）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        # SSE 必配
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 精确 /api（无子路径）同样转发，避免落入 C 端
    location = /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # B 端管理台：^~ 保证 /admin 及 /admin/* 全部命中（含 basePath 静态资源 /admin/_next/*）
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 协作画布同步（tldraw sync）：WebSocket 长连接，只放行 /collab/connect/。
    # proxy_pass 尾部带 URI → 剥掉 /collab 前缀，协作服务收到 /connect/<roomId>。
    # 其余 /collab/* 一律 404（health / rooms 等内部端点只许本机 127.0.0.1 直连，
    # 服务端另有来源 IP 校验兜底）。鉴权由协作服务自己做（cookie → /api/auth/verify）。
    location ^~ /collab/connect/ {
        proxy_pass http://127.0.0.1:3030/connect/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    location ^~ /collab/ {
        return 404;
    }

    # ai-lab 聊天服务：剥离 /ailab 前缀（页面内 fetch 用相对路径），SSE 透传
    # SSO 门禁（方案A）：auth_request 子请求校验 NoteLab 会话，未登录 302 到游戏中心登录页
    location ^~ /ailab/ {
        auth_request /_ailab_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;
        error_page 401 = @ailab_login;
        # 2026-10-10：门禁后端（Java :8001）不可用时，nginx 会把子请求的 502/504
        # 转成 500 抛给用户（error.log：auth request unexpected status: 502）。
        # 部署 Java 时 mvn 覆盖 jar 会让旧进程当场死亡，这条路径必现，用户看到 500 白屏。
        # 降级成可读的 503：仍然 fail-closed（不放行），但至少说清原因。
        error_page 500 502 503 504 = @ailab_unavailable;

        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 无尾斜杠访问重定向到带斜杠版本
    location = /ailab {
        return 302 /ailab/;
    }

    # SSO 校验子请求：转 Java /api/auth/verify，透传 Cookie；丢弃子请求体
    location = /_ailab_auth {
        internal;
        proxy_pass http://127.0.0.1:8001/api/auth/verify;
        proxy_method GET;
        proxy_set_header Origin "";
        proxy_set_header X-Auth-Purpose "ailab";
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 未登录（verify 返回 401）：302 到 C 端登录页，登录后回跳原始地址
    location @ailab_login {
        return 302 /login?next=$request_uri;
    }

    # 门禁后端不可用（Java 挂了 / 正在部署）：503 + 说明，别给用户 500 白屏
    location @ailab_unavailable {
        default_type text/html;
        return 503 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务暂时不可用</title></head><body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0e13;color:#d4d4d8;font-family:system-ui,-apple-system,sans-serif"><div style="text-align:center;max-width:24rem;padding:1.5rem"><div style="font-size:2rem;margin-bottom:.75rem">🛠️</div><h1 style="font-size:1.125rem;font-weight:700;margin:0 0 .5rem">服务暂时不可用</h1><p style="color:#a1a1aa;font-size:.875rem;line-height:1.6;margin:0 0 1rem">登录校验服务正在重启（通常在几十秒内恢复），请稍后重试。</p><a href="/ailab/" style="color:#fbbf24;font-size:.875rem">重试 →</a></div></body></html>';
    }

    # 类吸血鬼幸存者（原独立仓 vs-h5）：代码已并入 notelab-c/apps/play/public/vs/
    # 入口是 /play/vs（play 应用里的 iframe 包装页，挂游戏登录墙）；这里只服务游戏本体的静态文件。
    # ⚠️ 访问要用 /vs/index.html —— Next 的 public/ 没有目录索引（/vs/ 会 404）。
    # ⚠️ 这是 2026-10-19 收敛后的形态：老地址 /vs 一律 308 到 /play/vs。
    location = /vs {
        return 308 /play/vs;
    }
    location ^~ /vs/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 雷霆战机（原独立仓 thunder-h5）：代码已并入 notelab-c/apps/play/public/thunder/
    # 同上：入口 /play/thunder，静态文件走 :3011，老地址 /thunder 308 到 /play/thunder。
    location = /thunder {
        return 308 /play/thunder;
    }
    location ^~ /thunder/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 博客语音朗读：反代本机 kokoro TTS（服务仅监听 127.0.0.1，API key 由 nginx 注入，不暴露给前端）
	# Notelab 练习实践解答页：内容运行时从数据库取，交给本机的 SSR 进程
	# （见 astro.config.mjs 的 @astrojs/node adapter；构建产物 dist/server/entry.mjs）
	# ⚠️ 必须排在 location /blog 之前：这两个页面走 Node，其余博客页面仍由 nginx 直接发文件。
	# Notelab 草稿预览页：内容运行时从 Notelab 的内存短期存储取，交给本机的 SSR 进程
	# （见 astro.config.mjs 的 @astrojs/node adapter；构建产物 dist/server/entry.mjs）
	# ⚠️ 用 ^~ 前缀匹配：更长前缀优先，所以 /blog/solutions 与 /blog/preview 会盖住 location /blog，
	#    其余博客页面仍由 nginx 直接发静态文件。
	location ^~ /blog/preview {
		proxy_pass http://127.0.0.1:3012;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
	}
	location ^~ /blog/solutions {
		proxy_pass http://127.0.0.1:3012;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
	}
    location ^~ /blog/tts/ {
        proxy_pass http://127.0.0.1:8880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer kk-a108b3ae2c1d4416bc11606a2408";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 静态博客：Astro 构建产物。目录名与路径前缀一致，故用 root 而非 alias
    location ^~ /blog {
        root /var/www;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 旧个人主页入口 /home：已并入 C 端根路径 /，301 回根
    location = /home {
        return 301 /;
    }

    # C 端游戏中心：迁至 /games 前缀（Next，保留前缀代理）
    location ^~ /games {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # C 端旧路径兼容：老书签/外链 301 到 /games 下新路径
    location = /spire { return 301 /games/spire; }
    location /trpg { rewrite ^/trpg(.*)$ /games/trpg$1 permanent; }

    # 写死错的登录路径兜底：C 端登录页是顶层 /login，`/games` 只是 nginx 保留前缀的
    # 代理段（proxy_pass 无尾斜杠），/games/login 在 Next 里没有对应路由 → 一直 404。
    # 308（保留方法与 query，?next= 能带过去）到 /login，
    # 救活旧书签 / 文档链接 / 尚未重新构建的前端产物。
    location = /games/login { return 308 /login$is_args$args; }

    # ===== 阶段 2（2026-10-11）：/play/* 拆成独立 Next 应用（pm2 notelab-play, :3011）=====
    # 只改 <domain> 的 443 块——80 端口那个 server 只负责 301 到 HTTPS，不必重复分流。

    # 静态资源：play 应用用 assetPrefix=/play-static，避免与主应用的 /_next/static/* 冲突
    # （两个应用同域，hash 文件名可能重名但内容不同，必须各自独立命名空间）。
    # ⚠️ 必须 ^~ 前缀匹配：/play-static/... 不能被正则 location 抢走。
    location ^~ /play-static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # 静态资源带 hash，可长缓存
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 裸 /play（无尾斜杠）：play 应用没有根路由 → 回游戏中心
    # 保留 query（?ref= 之类），308 保方法。
    # ===== 阶段 2 补充（2026-10-11）：游戏静态素材归 play 应用 =====
    # public/loot (1.2M) 与 public/spire (4.4M) 已 git mv 到 apps/play/public/，
    # 只有 play 域在用（主应用 src/ 零引用），URL 前缀保持不变以免影响 B 端下发的路径。
    location ^~ /loot/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /spire/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 主应用的图标（apps/play 暂无自己的 icon，缺失时回落主应用，避免 favicon 404）
    location = /favicon.ico { proxy_pass http://127.0.0.1:3010; proxy_set_header Host $host; }
    location = /icon.svg   { proxy_pass http://127.0.0.1:3010; proxy_set_header Host $host; }

    location = /play { return 308 /games$is_args$args; }

    # 游戏台路由本体
    location ^~ /play/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 默认入口：C 端（个人主页 / + 其余路由由 Next 处理）
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
